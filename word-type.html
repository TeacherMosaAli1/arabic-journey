<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رحلة الكلمات</title>
<style>
  :root{--bg:#08111f;--panel:#101b2e;--panel2:#16243a;--text:#f7f8fb;--muted:#b8c0cf;--gold:#f0b548;--accent:#7c5cff;--ok:#38c98a;--bad:#ef6a78;--border:#2a3953}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,rgba(124,92,255,.15),transparent 28%),radial-gradient(circle at bottom left,rgba(240,181,72,.10),transparent 25%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
  .wrap{width:min(94vw,760px);margin:0 auto;padding:24px 14px 40px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.title{font-size:18px;font-weight:700}.score-pill{border:1px solid #4a5870;border-radius:999px;padding:8px 12px;color:#ffd77a;background:#0e192a}.progress{height:10px;background:#18253b;border-radius:999px;overflow:hidden;border:1px solid #28364e}.progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .35s ease}.card{margin-top:18px;background:rgba(16,27,46,.96);border:1px solid var(--border);border-radius:26px;padding:26px 20px;box-shadow:0 18px 48px rgba(0,0,0,.25)}.center{text-align:center}h1,h2{margin:0 0 14px;line-height:1.7}h1{font-size:30px;color:#ffe19a}h2{font-size:23px}p{line-height:1.9;color:var(--muted);margin:8px 0}.hero-icon{font-size:64px;margin:6px 0 12px}.question-sentence{font-size:26px;line-height:1.9;text-align:center;background:#0d1728;border:1px solid #263853;border-radius:18px;padding:16px;margin:16px 0}.target{color:#ffd56b;font-weight:800;border-bottom:2px solid #ffd56b}.prompt{font-size:20px;font-weight:700;line-height:1.8;margin:18px 0 12px;text-align:center}.options{display:grid;gap:11px}.option{width:100%;text-align:right;background:var(--panel2);color:var(--text);border:1px solid #33445f;border-radius:16px;padding:15px 16px;font-size:18px;cursor:pointer;transition:.18s ease}.option:hover{border-color:var(--gold);transform:translateY(-1px)}.option.correct{background:#113a2b;border-color:var(--ok)}.option.wrong{background:#421e2a;border-color:var(--bad)}.option:disabled{cursor:default;opacity:.96}.feedback{display:none;margin-top:16px;border-radius:16px;padding:15px 16px;line-height:1.9;background:#0d1728;border:1px solid #32425d}.feedback.show{display:block}.feedback.good{border-color:#2f8d68}.feedback.hint{border-color:#a47b2c}.label{display:inline-block;border:1px solid #765e27;color:#ffd56b;background:#1a1b1c;border-radius:999px;padding:6px 11px;margin-bottom:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:none;border-radius:16px;padding:13px 18px;font-size:17px;font-weight:700;cursor:pointer}.btn.primary{background:var(--gold);color:#172033}.btn.secondary{background:#263652;color:#fff;border:1px solid #3c4f70}.btn:disabled{opacity:.45;cursor:not-allowed}.section-badge{font-size:14px;color:#ffd56b;margin-bottom:8px}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.metric{background:#0d1728;border:1px solid #2a3953;border-radius:16px;padding:14px;text-align:center}.metric strong{display:block;font-size:24px;color:#ffe19a;margin-top:4px}.big-score{font-size:54px;font-weight:800;color:#ffe19a;margin:10px 0}.hidden{display:none!important}
  @media(max-width:560px){.question-sentence{font-size:22px}.prompt{font-size:18px}.option{font-size:16px}.result{grid-template-columns:1fr}h1{font-size:27px}}
  .watermark{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;color:rgba(255,255,255,.72);font-size:clamp(24px,5vw,38px);font-weight:900;background:rgba(8,17,31,.78);border:2px solid rgba(240,181,72,.42);border-radius:18px;padding:9px 24px;min-width:max-content;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.28);pointer-events:none;user-select:none;backdrop-filter:blur(5px)}
  .student-name{width:100%;max-width:420px;padding:14px 16px;border-radius:14px;border:1px solid #3c4f70;background:#0d1728;color:#fff;font-size:18px;text-align:right;margin-top:14px}
  .name-error{color:#ff9aa5;margin-top:8px;font-weight:700}
</style>
</head>
<body>
<div class="watermark">المعلّم موسى علي</div>
<div class="wrap">
  <div class="topbar"><div class="title">🌟 رحلة الكلمات</div><div class="score-pill" id="scorePill">العلامة: 0 / 10</div></div>
  <div class="progress"><span id="progressBar"></span></div>
  <main class="card" id="app"></main>
</div>
<script>
const questions = [
  {section:"الاسم",icon:"👤",sentence:'<span class="target">الْقُرْآنُ</span> الْكَريمُ كِتابُ اللَّهِ.',prompt:'ماذا تَدُلُّ كَلِمَةُ «الْقُرْآنِ»؟',options:['👤 شَخْصٌ أَوْ حَيَوانٌ أَوْ نَباتٌ أَوْ جَمادٌ أَوْ مَعْنًى','⚡ حَدَثٌ وَزَمَنٌ','🔗 مَعْنًى يَظْهَرُ مَعَ غَيْرِها'],correct:0,wrongFeedback:['','💡 «الْقُرْآنُ» لا يَدُلُّ عَلى حَدَثٍ وَزَمَنٍ؛ فَهُوَ لَيْسَ فِعْلًا. فَكِّرْ: ما الشَّيْءُ الَّذي نُسَمِّيهِ بِهذِهِ الْكَلِمَةِ؟','💡 هذِهِ صِفَةُ الْحَرْفِ، أَمّا «الْقُرْآنُ» فَلَهُ مَعْنًى مُسْتَقِلٌّ وَهُوَ اسْمُ كِتابِ اللَّهِ. جَرِّبْ مَرَّةً أُخْرى.'],feedback:'✅ أَحْسَنْتَ! «الْقُرْآنُ» اسْمٌ.<br><b>وَالْكَلِمَةُ الَّتي تَدُلُّ عَلى إِنْسانٍ أَوْ حَيَوانٍ أَوْ نَباتٍ أَوْ جَمادٍ أَوْ مَعْنًى هِيَ اسْمٌ.</b><br>🔎 لاحِظْ: بَدَأَتْ كَلِمَةُ «الْقُرْآنِ» بِـ(الـ)، وَدُخولُ (الـ) مِنْ عَلاماتِ الاسْمِ.'},
  {section:"الاسم",icon:"👤",sentence:'<span class="target">هوَ</span> يُحِبُّ الْقِراءَةَ.',prompt:'عَلى مَنْ تَدُلُّ كَلِمَةُ «هوَ»؟',options:['👤 شَخْصٌ','⚡ حَدَثٌ','🔗 لا يَظْهَرُ مَعْناها إِلّا مَعَ غَيْرِها'],correct:0,wrongFeedback:['','💡 «هوَ» لا تُخْبِرُنا عَنْ عَمَلٍ يَحْدُثُ؛ بَلْ نَسْتَعْمِلُها لِنَدُلَّ عَلى شَخْصٍ.','💡 «هوَ» لَها دَلالَةٌ واضِحَةٌ عَلى شَخْصٍ، وَلَيْسَتْ حَرْفًا. جَرِّبْ مَرَّةً أُخْرى.'],feedback:'✅ رائِعٌ! «هوَ» يَدُلُّ عَلى شَخْصٍ، فَهُوَ اسْمٌ.<br><b>إِذَنْ لَيْسَ مِنَ الضَّرورِيِّ أَنْ يَبْدَأَ الاسْمُ بِـ(الـ)، فَالضَّمائِرُ أَسْماءٌ أَيْضًا.</b>'},
  {section:"الاسم",icon:"👤",sentence:'<span class="target">عَليٌّ</span> ماهِرٌ في لَعِبِ كُرَةِ الْقَدَمِ.',prompt:'ماذا تَدُلُّ كَلِمَةُ «عَليّ»؟',options:['👤 شَخْصٌ','⚡ حَدَثٌ وَزَمَنٌ','🔗 مَعْنًى يَظْهَرُ مَعَ غَيْرِها'],correct:0,wrongFeedback:['','💡 «عَليٌّ» اسْمُ شَخْصٍ، وَلَيْسَ عَمَلًا يَحْدُثُ في زَمَنٍ.','💡 «عَليٌّ» لَهُ مَعْنًى مُسْتَقِلٌّ وَيَدُلُّ عَلى شَخْصٍ، فَلا يَكُونُ حَرْفًا.'],feedback:'✅ صَحيحٌ! «عَليٌّ» اسْمٌ؛ لِأَنَّهُ يَدُلُّ عَلى شَخْصٍ.<br><b>وَاسْمُ الشَّخْصِ مِثْلُ «عَليٍّ» يُسَمّى اسْمَ عَلَمٍ.</b>'},
  {section:"الاسم",icon:"👤",sentence:'<span class="target">الصِّدْقُ</span> فَضيلَةٌ.',prompt:'هَلْ «الصِّدْقُ» شَيْءٌ نَراهُ وَنَلْمِسُهُ؟',options:['نَعَمْ','لا، لَكِنَّهُ يَدُلُّ عَلى مَعْنًى'],correct:1,wrongFeedback:['💡 لا نَسْتَطيعُ أَنْ نَرى «الصِّدْقَ» أَوْ نَلْمِسَهُ، وَلَكِنَّنا نَفْهَمُ مَعْناهُ. جَرِّبْ مَرَّةً أُخْرى.',''],feedback:'✅ أَحْسَنْتَ! «الصِّدْقُ» اسْمٌ، مَعَ أَنَّهُ يَدُلُّ عَلى مَعْنًى لا نَراهُ أَوْ نَلْمِسُهُ.<br><b>فَالاسْمُ قَدْ يَدُلُّ عَلى إِنْسانٍ أَوْ حَيَوانٍ أَوْ نَباتٍ أَوْ جَمادٍ أَوْ مَعْنًى.</b>'},
  {section:"الفعل",icon:"⚡",sentence:'<span class="target">يَقْرَأُ</span> الطّالِبُ الْقِصَّةَ.',prompt:'ماذا تُخْبِرُنا كَلِمَةُ «يَقْرَأُ»؟',options:['👤 شَخْصٌ أَوْ حَيَوانٌ أَوْ نَباتٌ أَوْ جَمادٌ أَوْ مَعْنًى','⚡ حَدَثٌ يَحْصُلُ في الْوَقْتِ الْحالِي','🔗 مَعْنًى يَظْهَرُ مَعَ غَيْرِها'],correct:1,wrongFeedback:['💡 «يَقْرَأُ» لا تُسَمّي شَخْصًا أَوْ شَيْئًا؛ إِنَّها تُخْبِرُنا عَمّا يَفْعَلُهُ الطّالِبُ.','','💡 «يَقْرَأُ» لَيْسَ حَرْفًا؛ فَهِيَ تُخْبِرُنا عَنْ عَمَلٍ يَحْدُثُ في زَمَنٍ.'],feedback:'✅ أَحْسَنْتَ! هذِهِ الْكَلِمَةُ أَخْبَرَتْنا عَنْ حَدَثٍ يَحْصُلُ في الْوَقْتِ الْحالِي.<br><b>وَالْكَلِمَةُ الَّتي تَدُلُّ عَلى حَدَثٍ وَزَمَنٍ هِيَ فِعْلٌ.</b><br><b>يَقْرَأُ ← فِعْلٌ مُضارِعٌ ⚡</b><br>الْفِعْلُ الْمُضارِعُ يَدُلُّ عَلى حَدَثٍ يَحْصُلُ في الْوَقْتِ الْحالِي أَوْ سَيَحْصُلُ في الْمُسْتَقْبَلِ.'},
  {section:"الفعل",icon:"⚡",sentence:'<span class="target">كَتَبَ</span> الْمُعَلِّمُ عَلى السَّبّورَةِ.',prompt:'مَتى حَدَثَتِ الْكِتابَةُ؟',options:['⏮️ حَدَثَتْ وانْتَهَتْ','▶️ تَحْدُثُ الْآنَ أَوْ سَتَحْدُثُ','🎯 يَطْلُبُ مِنْ شَخْصٍ أَنْ يَقومَ بِها'],correct:0,wrongFeedback:['','💡 «كَتَبَ» تُخْبِرُنا عَنْ كِتابَةٍ وَقَعَتْ وَانْتَهَتْ، وَلَيْسَ عَنْ حَدَثٍ يَجْري الْآنَ.','💡 «كَتَبَ» إِخْبارٌ عَنْ حَدَثٍ وَقَعَ، وَلَيْسَ طَلَبًا لِلْقِيامِ بِالْكِتابَةِ.'],feedback:'✅ رائِعٌ! الْكِتابَةُ حَدَثَتْ وَانْتَهَتْ.<br><b>إِذَنْ «كَتَبَ» فِعْلٌ ماضٍ؛ لِأَنَّ الْفِعْلَ الْماضِيَ يَدُلُّ عَلى حَدَثٍ وَقَعَ وَانْتَهى.</b><br><b>كَتَبَ ← فِعْلٌ ماضٍ ⏮️</b>'},
  {section:"الفعل",icon:"⚡",sentence:'<span class="target">انْسَخِ</span> الدَّرْسَ.',prompt:'ماذا يُريدُ الْمُتَكَلِّمُ؟',options:['⏮️ يُخْبِرُنا عَنْ حَدَثٍ انْتَهى','▶️ يُخْبِرُنا عَنْ حَدَثٍ يَحْصُلُ الْآنَ','🎯 يَطْلُبُ مِنْ شَخْصٍ الْقيامَ بِشَيْءٍ'],correct:2,wrongFeedback:['💡 «انْسَخِ» لا تُخْبِرُنا عَنْ نَسْخٍ انْتَهى؛ إِنَّ الْمُتَكَلِّمَ يَطْلُبُ مِنْكَ أَنْ تَقُومَ بِالْعَمَلِ.','💡 «انْسَخِ» لا تَصِفُ عَمَلًا يَحْدُثُ الْآنَ؛ إِنَّها طَلَبٌ لِلْقِيامِ بِالْعَمَلِ.',''],feedback:'✅ أَحْسَنْتَ! الْمُتَكَلِّمُ يَطْلُبُ الْقيامَ بِالنَّسْخِ.<br><b>إِذَنْ «انْسَخِ» فِعْلُ أَمْرٍ؛ لِأَنَّ فِعْلَ الْأَمْرِ يَدُلُّ عَلى طَلَبِ الْقيامِ بِشَيْءٍ.</b><br><b>انْسَخِ ← فِعْلُ أَمْرٍ 🎯</b>'},
  {section:"الحرف",icon:"🔗",sentence:'ذَهَبْتُ <span class="target">إِلى</span> الْعَقَبَةِ.',prompt:'ماذا تُلاحِظُ في كَلِمَةِ «إِلى»؟',options:['👤 تَدُلُّ عَلى شَخْصٍ أَوْ حَيَوانٍ أَوْ نَباتٍ أَوْ جَمادٍ أَوْ مَعْنًى','⚡ تَدُلُّ عَلى حَدَثٍ وَزَمَنٍ','🔗 يَظْهَرُ مَعْناها مَعَ غَيْرِها'],correct:2,wrongFeedback:['💡 «إِلى» لا تُسَمّي شَخْصًا أَوْ شَيْئًا، فَهِيَ لَيْسَتِ اسْمًا.','💡 «إِلى» لا تَدُلُّ عَلى عَمَلٍ يَحْدُثُ في زَمَنٍ، فَهِيَ لَيْسَتْ فِعْلًا.',''],feedback:'✅ أَحْسَنْتَ! «إِلى» حَرْفٌ.<br><b>الْحَرْفُ كَلِمَةٌ يَظْهَرُ مَعْناها مَعَ غَيْرِها.</b>'},
  {section:"الحرف",icon:"🔗",sentence:'فازَ مُحَمَّدٌ <span class="target">وَ</span>عُمَرٌ في الْمُسابَقَةِ.',prompt:'ما وَظيفَةُ الْواوِ هُنا؟',options:['👤 تَدُلُّ عَلى شَخْصٍ','⚡ تَدُلُّ عَلى حَدَثٍ','🔗 تَرْبِطُ بَيْنَ «مُحَمَّدٍ» وَ«عُمَرَ»'],correct:2,wrongFeedback:['💡 الْواوُ نَفْسُها لا تَدُلُّ عَلى شَخْصٍ؛ «مُحَمَّدٌ» وَ«عُمَرٌ» هُما الاسْمانِ.','💡 الْواوُ لا تَدُلُّ عَلى حَدَثٍ؛ الْفِعْلُ في الْجُمْلَةِ هُوَ «فازَ». لاحِظْ ما الَّذي فَعَلَتْهُ الْواوُ بَيْنَ الاسْمَيْنِ.',''],feedback:'✅ رائِعٌ! الْواوُ رَبَطَتْ بَيْنَ «مُحَمَّدٍ» وَ«عُمَرَ».<br><b>الْواوُ هُنا حَرْفُ عَطْفٍ، وَالْحُروفُ تُؤَدّي مَعانِيَها مَعَ غَيْرِها.</b><br><b>وَ ← حَرْفُ عَطْفٍ 🔗</b>'},
  {section:"الحرف",icon:"🔗",sentence:'<span class="target">لَنْ</span> أُهْمِلَ دُروسي.',prompt:'ما نَوْعُ كَلِمَةِ «لَنْ»؟',options:['👤 اسْمٌ','⚡ فِعْلٌ','🔗 حَرْفٌ'],correct:2,wrongFeedback:['💡 «لَنْ» لا تُسَمّي إِنْسانًا أَوْ حَيَوانًا أَوْ نَباتًا أَوْ جَمادًا أَوْ مَعْنًى، فَهِيَ لَيْسَتِ اسْمًا.','💡 «لَنْ» لا تَدُلُّ بِنَفْسِها عَلى حَدَثٍ وَزَمَنٍ؛ الْحَدَثُ في الْجُمْلَةِ هُوَ «أُهْمِلَ».',''],feedback:'✅ مُمْتازٌ! «لَنْ» حَرْفٌ.<br>فَهِيَ لا تَدُلُّ عَلى شَخْصٍ أَوْ شَيْءٍ أَوْ مَعْنًى مُسْتَقِلٍّ، وَلا تَدُلُّ عَلى حَدَثٍ وَزَمَنٍ، وَإِنَّما تُؤَدّي مَعْناها مَعَ الْفِعْلِ بَعْدَها.<br><b>لَنْ ← حَرْفٌ 🔗</b>'}
];

let index=0,score=0,firstTry=true,locked=false,studentName="";
let sectionScores={الاسم:0,الفعل:0,الحرف:0};
const sectionTotals={الاسم:4,الفعل:3,الحرف:3};
const app=document.getElementById('app'),progressBar=document.getElementById('progressBar'),scorePill=document.getElementById('scorePill');

function startScreen(){
 app.innerHTML=`<div class="center"><div class="hero-icon">🧭✨</div><h1>رحلة الكلمات</h1><h2>هل تستطيع اكتشاف أسرار الكلمات؟</h2><p>أمامك <b>10 تحديات</b>. في كل تحدٍّ ستكتشف شيئًا جديدًا عن الاسم والفعل والحرف.</p><p><b>العلامة النهائية: 10 / 10 ⭐</b></p><input class="student-name" id="studentName" type="text" placeholder="اكتب اسمك هنا"><div id="nameError" class="name-error hidden">اكتب اسمك أولًا لبدء الرحلة.</div><div class="actions" style="justify-content:center"><button class="btn primary" id="startBtn">اِبْدَأِ الرِّحْلَةَ 🚀</button></div></div>`;
 document.getElementById('startBtn').addEventListener('click',()=>{const n=document.getElementById('studentName').value.trim();if(!n){document.getElementById('nameError').classList.remove('hidden');return}studentName=n;renderQuestion()});
}
function renderQuestion(){
 locked=false;firstTry=true;const q=questions[index];progressBar.style.width=`${(index/questions.length)*100}%`;
 app.innerHTML=`<div class="section-badge">${q.icon} ${q.section} • التحدي ${index+1} من ${questions.length}</div><div class="question-sentence">${q.sentence}</div><div class="prompt">${q.prompt}</div><div class="options" id="options">${q.options.map((o,i)=>`<button class="option" data-i="${i}">${o}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn primary hidden" id="nextBtn">${index===questions.length-1?'اِعْرِضِ النَّتيجَةَ 🏆':'تابِعْ ←'}</button></div>`;
 document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>handleAnswer(Number(btn.dataset.i),btn)));
}
function handleAnswer(choice,btn){
 if(locked)return;const q=questions[index],feedback=document.getElementById('feedback');
 if(choice===q.correct){locked=true;btn.classList.add('correct');document.querySelectorAll('.option').forEach(b=>b.disabled=true);if(firstTry){score++;sectionScores[q.section]++;scorePill.textContent=`العلامة: ${score} / 10`;}feedback.className='feedback show good';feedback.innerHTML=`${q.feedback}<br><br>${firstTry?'⭐ حصلت على نقطة.':'🌱 أحسنت! تعلّمتها في المحاولة الثانية.'}`;document.getElementById('nextBtn').classList.remove('hidden')}
 else{btn.classList.add('wrong');btn.disabled=true;if(firstTry){firstTry=false;feedback.className='feedback show hint';feedback.innerHTML=`❌ لَيْسَتِ الْإِجابَةَ الْأَنْسَبَ.<br>${q.wrongFeedback?.[choice]||'💡 فَكِّرْ في مَعْنَى الْكَلِمَةِ وَجَرِّبْ مَرَّةً أُخْرى.'}<br><b>جَرِّبْ مَرَّةً أُخْرى.</b>`}else{feedback.className='feedback show hint';feedback.innerHTML=`${q.wrongFeedback?.[choice]||'💡 فَكِّرْ في مَعْنَى الْكَلِمَةِ.'}<br><b>حاوِلْ مِنْ جَديدٍ.</b>`}}
}
document.addEventListener('click',e=>{if(e.target&&e.target.id==='nextBtn'){index++;if(index<questions.length)renderQuestion();else renderResults()}});
function resultMessage(){if(score===10)return'🏆 بطل الكلمات! أتقنت التمييز بين الاسم والفعل والحرف وأنواع الفعل.';if(score>=8)return'🌟 أداء رائع! اقتربت من الإتقان، وراجع التحديات التي أخطأت فيها.';if(score>=6)return'💪 بداية جيدة! أعد تدريب المهارات التي تحتاج إلى تثبيت.';return'🌱 الرحلة للتعلّم. أعد المحاولة وستلاحظ تقدّمك.'}
function renderResults(){
 progressBar.style.width='100%';
 app.innerHTML=`<div class="center"><div class="hero-icon">🏆</div><h1>أكملت رحلة الكلمات!</h1><div class="big-score">${score} / 10</div><p>${resultMessage()}</p></div><div class="result"><div class="metric">👤 الاسم<strong>${sectionScores['الاسم']} / ${sectionTotals['الاسم']}</strong></div><div class="metric">⚡ الفعل وأنواعه<strong>${sectionScores['الفعل']} / ${sectionTotals['الفعل']}</strong></div><div class="metric">🔗 الحرف<strong>${sectionScores['الحرف']} / ${sectionTotals['الحرف']}</strong></div></div><div class="actions"><button class="btn primary" id="retryBtn">🔄 أَعِدِ الرِّحْلَةَ</button></div>`;
 if(window.saveStudentResult)window.saveStudentResult({name:studentName,score,total:10,nounScore:sectionScores['الاسم'],nounTotal:4,verbScore:sectionScores['الفعل'],verbTotal:3,particleScore:sectionScores['الحرف'],particleTotal:3,quiz:'نوع الكلمة'});
 document.getElementById('retryBtn').addEventListener('click',()=>{index=0;score=0;sectionScores={الاسم:0,الفعل:0,الحرف:0};scorePill.textContent='العلامة: 0 / 10';progressBar.style.width='0%';startScreen()});
}
startScreen();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCf64Giu6SC0mhopzZ1XM3kCIxbbUMswzQ",authDomain:"arabic-journey-4b4b5.firebaseapp.com",projectId:"arabic-journey-4b4b5",storageBucket:"arabic-journey-4b4b5.firebasestorage.app",messagingSenderId:"563457129414",appId:"1:563457129414:web:ead6c2b11908200fe990c7",measurementId:"G-LRX1HKF5FV"};
const firebaseApp=initializeApp(firebaseConfig);const db=getFirestore(firebaseApp);
window.saveStudentResult=async function(r){try{await addDoc(collection(db,"studentResults"),{name:r.name,score:r.score,total:r.total,nounScore:r.nounScore,nounTotal:r.nounTotal,verbScore:r.verbScore,verbTotal:r.verbTotal,particleScore:r.particleScore,particleTotal:r.particleTotal,quiz:r.quiz,createdAt:serverTimestamp()})}catch(e){console.error(e)}};
</script>
